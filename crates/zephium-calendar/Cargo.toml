[package]
name = "zephium-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Derives `specta::Type` on the wire types the desktop exports to TypeScript.
ipc-types = ["dep:specta"]

[dependencies]
zephium-credentials.workspace = true
zephium-store.workspace = true
specta = { workspace = true, optional = true }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
quick-xml = "0.41"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "system-proxy"] }
rrule = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
ulid.workspace = true
url.workspace = true
base64.workspace = true
zeroize = "=1.9.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
